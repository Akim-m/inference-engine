model:
  base_id: "google/medgemma-4b-it"
  adapter_output_dir: "./finetune/adapters/dermatology-isic2019"  # relative to repo root; run training script from repo root
  hf_token: ""  # or set HF_TOKEN env var

dataset:
  hf_path: "marmal88/skin_cancer"
  image_column: "image"
  label_column: "dx"
  val_fraction: 0.10
  seed: 42

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: "none"
  task_type: "CAUSAL_LM"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

training:
  num_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8   # effective batch = 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_seq_length: 512
  gradient_checkpointing: true
  fp16: false
  bf16: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  dataloader_num_workers: 0   # 0 on Windows; set 2 on Linux
  remove_unused_columns: false
  report_to: "none"

hardware_overrides:
  rtx4060:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
  t4:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    gradient_checkpointing: true
  a100:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 1
    gradient_checkpointing: false
    load_in_4bit: false   # quantization override; routed to quantization.load_in_4bit by loader
